[build-system]
requires = ["setuptools", "wheel", "setuptools_scm[toml]>=7"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = "../../"
# Do NOT add --abbrev=0 here. It collapses describe's output to a bare tag name,
# which hides the commit distance and makes setuptools_scm read *every* commit as
# an exact release -- so building an untagged commit silently reproduces the last
# released version instead of a .devN version. --long keeps the distance visible.
git_describe_command = 'git describe --tags --long --dirty --match "modelrunner_ai_v*"'
tag_regex = "^modelrunner_ai_v(?P<version>.*)$"

[project]
name = "modelrunner-ai"
dynamic = ["version"]
description = "Python client for modelrunner.ai"
readme = "README.md"
authors = [{ name = "Features & Labels <support@modelrunner.ai>" }]
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.21.0,<1",
    "httpx-sse>=0.4.0,<0.5",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    # client.py imports PIL.Image under TYPE_CHECKING only. Without Pillow
    # installed, sphinx-autodoc-typehints cannot resolve the `Image.Image`
    # forward references on upload_image/encode_image and renders them broken.
    "pillow",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pillow",
]
dev = [
    "modelrunner_ai[docs,test]",
]

[project.urls]
homepage = "https://modelrunner.ai"
repository = "https://github.com/modelrunner/modelrunner"

[tool.pytest.ini_options]
testpaths = "tests/"
asyncio_mode = "auto"

[tool.setuptools]
packages = ["modelrunner_ai"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"modelrunner_ai" = ["py.typed"]
