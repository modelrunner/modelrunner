name: SDK checks

on:
  pull_request:
    types: [assigned, opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sdk-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install SDK and test dependencies
        run: python -m pip install -e 'projects/modelrunner_ai[test]'
      - name: Check Python syntax
        run: python -m compileall -q projects/modelrunner_ai/src/modelrunner_ai
      - name: Run existing unit tests
        working-directory: projects/modelrunner_ai
        run: python -m pytest tests/unit -q
