name: PyPI release
run-name: PyPI release ${{ inputs.tag || github.ref }}

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (see create-release workflow)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      name: ${{ steps.parse.outputs.name }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v2
        with:
          python-version: "3.9"

      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.event.inputs.tag || github.ref }}
        run: |
          regex="^(refs/tags/)?(.*)_v(.*)$"
          [[ $TAG =~ $regex ]] || exit 1
          name=${BASH_REMATCH[2]}
          version=${BASH_REMATCH[3]}
          echo "Parsed name=$name version=$version"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: python -m pip install --upgrade pip setuptools_scm build

      - name: Build
        working-directory: projects/${{ steps.parse.outputs.name }}
        run: python -m build

      # Guard against publishing a version that is not the one the tag names.
      # setuptools_scm derives the version from `git describe`, so anything that
      # makes describe resolve to the wrong tag -- most notably two
      # <project>_v* tags pointing at the same commit -- would otherwise upload
      # the wrong version to PyPI with a fully green run. Fail loudly instead.
      - name: Verify built version matches the release tag
        working-directory: projects/${{ steps.parse.outputs.name }}
        env:
          EXPECTED_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          python - <<'PY'
          import glob, os, sys
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          expected = Version(os.environ["EXPECTED_VERSION"])
          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"::error::expected exactly one wheel in dist/, found {wheels}")

          built = parse_wheel_filename(os.path.basename(wheels[0]))[1]
          print(f"tag version:   {expected}")
          print(f"built version: {built}")

          if built != expected:
              sys.exit(
                  f"::error::built version {built} does not match release tag "
                  f"version {expected}; refusing to publish. Check that exactly one "
                  f"tag matching the project prefix points at this commit "
                  f"(git tag --points-at HEAD)."
              )
          print("OK: built version matches the tag")
          PY

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: projects/${{ steps.parse.outputs.name }}/dist

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.name }}
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
